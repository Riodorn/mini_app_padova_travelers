<title>Padova Travel — Cerca Viaggio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Vai al contenuto principale</a>

  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 17V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10"/>
          <path d="M3 17h18"/>
          <path d="M7 17v-3a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v3"/>
        </svg>
        <span class="brand-text">Padova Travel</span>
      </div>
      <p class="header-subtitle">Cerca il tuo viaggio in treno</p>
    </div>
  </header>

  <main id="main" class="app-main" role="main">
    <form id="searchForm" class="search-form" novalidate>
      <div class="form-field">
        <label for="partenza" class="field-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          <span>Partenza</span>
        </label>
        <div class="input-wrapper">
          <input
            id="partenza"
            type="text"
            name="partenza"
            class="form-input"
            placeholder="Es. Padova, Venezia, Roma..."
            autocomplete="off"
            aria-describedby="partenza-hint"
            aria-autocomplete="list"
            aria-controls="partenza-suggestions"
            required
          >
          <span class="input-clear" aria-hidden="true" hidden>&times;</span>
        </div>
        <span id="partenza-hint" class="field-hint">Minimo 3 caratteri</span>
        <div id="partenza-suggestions" class="suggestions-dropdown" role="listbox" aria-label="Stazioni di partenza suggerite" hidden></div>
      </div>

      <div class="form-field">
        <label for="arrivo" class="field-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span>Arrivo</span>
        </label>
        <div class="input-wrapper">
          <input
            id="arrivo"
            type="text"
            name="arrivo"
            class="form-input"
            placeholder="Es. Milano, Bologna, Firenze..."
            autocomplete="off"
            aria-describedby="arrivo-hint"
            aria-autocomplete="list"
            aria-controls="arrivo-suggestions"
            required
          >
          <span class="input-clear" aria-hidden="true" hidden>&times;</span>
        </div>
        <span id="arrivo-hint" class="field-hint">Minimo 3 caratteri (opzionale)</span>
        <div id="arrivo-suggestions" class="suggestions-dropdown" role="listbox" aria-label="Stazioni di arrivo suggerite" hidden></div>
      </div>

      <div class="form-actions">
        <button type="submit" id="cerca" class="btn btn-primary btn-submit" disabled>
          <span class="btn-text">Cerca Viaggio</span>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>
      </div>

      <div id="searchStatus" class="search-status" aria-live="polite" hidden></div>
    </form>

    <section id="suggestionsSection" class="suggestions-section" aria-labelledby="suggestions-title" hidden>
      <h2 id="suggestions-title" class="section-title">Combinazioni suggerite</h2>
      <div id="suggestions" class="suggestions-list" role="list"></div>
      <p class="suggestions-empty" hidden>Nessuna combinazione trovata. Prova a modificare la ricerca.</p>
    </section>

    <section id="recentSection" class="recent-section" aria-labelledby="recent-title" hidden>
      <h2 id="recent-title" class="section-title">Ricerche recenti</h2>
      <div id="recentList" class="recent-list" role="list"></div>
    </section>
  </main>

  <footer class="app-footer" role="contentinfo">
    <p>Dati forniti da <a href="https://www.viaggiatreno.it/" target="_blank" rel="noopener">viaggiatreno.it</a> · <a href="https://t.me/padova_travel_bot" target="_blank" rel="noopener">@padova_travel_bot</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
